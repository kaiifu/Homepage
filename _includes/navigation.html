<nav class="main-navigation" aria-label="主导航">
  <div class="container nav-shell">
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-menu">
      <span>菜单</span>
      <span class="nav-toggle__icon" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <ul class="nav-list" id="primary-menu">
      {% for item in site.data.navigation %}
        {% assign item_url = item.url | relative_url %}
        {% assign is_active = false %}
        {% if page.url == item.url %}{% assign is_active = true %}{% endif %}
        <li>
          <a href="{{ item_url }}"{% if is_active %} class="is-active" aria-current="page"{% endif %}>{{ item.label }}</a>
        </li>
      {% endfor %}
    </ul>
  </div>
</nav>

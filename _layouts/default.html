<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101f24">
    {% assign resolved_title = page.title | default: site.title %}
    <title>{% if page.title and page.title != '首页' %}{{ resolved_title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/aifu.css' | relative_url }}">
  </head>
  <body class="{{ page.body_class | default: 'inner-page' }}">
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    {% include header.html %}
    <main id="main-content">
      {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/aifu.js' | relative_url }}" defer></script>
  </body>
</html>
